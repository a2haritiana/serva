name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that SERVA_VERSION matches the tag
        run: |
          TAG="$GITHUB_REF_NAME"
          version="$(sed -n 's/^SERVA_VERSION="\(.*\)"$/\1/p' lib/core.sh | head -n 1)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "SERVA_VERSION in lib/core.sh is '$version' but the tag is '$TAG'." >&2
            exit 1
          fi

      - name: Build the release archive and checksums
        run: |
          TAG="$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="serva-$TAG/" -o "serva-$TAG.tar.gz" "$TAG"
          sha256sum "serva-$TAG.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" "serva-$TAG.tar.gz" SHA256SUMS \
            --title "serva $TAG" --generate-notes --verify-tag
